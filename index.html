<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d6efd">
    <title>سیستم شارژ کارت NFC</title>
    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- تب‌ها -->
    <nav class="tabs">
        <button class="tab active" data-tab="admin">👤 ادمین</button>
        <button class="tab" data-tab="employee">🧑‍💼 کارمند</button>
    </nav>

    <!-- پنل ادمین -->
    <section id="admin" class="panel active">
        <h2>پنل ادمین</h2>
        <p class="hint">مبلغ رو برای UID کارت مشخص ثبت کن</p>

        <label>UID کارت</label>
        <input id="adminUid" type="text" placeholder="مثلاً 04a2b3c4" />

        <label>مبلغ (تومان)</label>
        <input id="adminAmount" type="number" placeholder="500" />

        <button id="adminSend" class="primary">ارسال به Firebase</button>
        <p id="adminLog" class="log"></p>

        <hr />

        <h3>آخرین کارت‌ها</h3>
        <div id="adminList" class="list"></div>
    </section>

    <!-- پنل کارمند -->
    <section id="employee" class="panel">
        <h2>پنل کارمند</h2>
        <p class="hint">کارت رو پشت گوشی بگیر تا مبلغ نوشته بشه</p>

        <button id="empScan" class="primary">شروع اسکن</button>
        <button id="empStop" class="secondary" disabled>توقف</button>
        <p id="empLog" class="log"></p>
    </section>

    <!-- Firebase SDK -->
    <script type="module" src="app.js"></script>
</body>
</html>
